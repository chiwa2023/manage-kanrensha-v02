Outputs:
  ALBDNSName:
    Description: DNS Name of the Application Load Balancer
    Value: !GetAtt PublicALB.DNSName
    Export:
      Name: !Sub "${EnvironmentName}-ALB-DNSName"

  ALBSecurityGroupId:
    Description: Security Group ID of the ALB
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-ALB-SecurityGroupId"

  EC2AppSecurityGroupId:
    Description: Security Group ID for EC2 App port access (only from ALB)
    Value: !Ref EC2AppSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-EC2-App-SecurityGroupId"
