  #     VpcId: !Ref VpcId
  #     TargetType: instance
  #     HealthCheckPath: /
  #     HealthCheckIntervalSeconds: 30
  #     HealthCheckTimeoutSeconds: 5
  #     HealthyThresholdCount: 2
  #     UnhealthyThresholdCount: 3
  #     Matcher:
  #       HttpCode: '200'
  #     Targets:
  #       - Id: !Ref TargetEc2InstanceId
  #         Port: 8030

  # TGInvestigateBack:
  #   Type: AWS::ElasticLoadBalancingV2::TargetGroup
  #   Properties:
  #     Name: !Sub "${EnvironmentName}-tg-investigate-back"
  #     Port: 6380
  #     Protocol: HTTP
  #     VpcId: !Ref VpcId
  #     TargetType: instance
  #     HealthCheckPath: /api/actuator/health
  #     HealthCheckIntervalSeconds: 30
  #     HealthCheckTimeoutSeconds: 5
  #     HealthyThresholdCount: 2
  #     UnhealthyThresholdCount: 5
  #     Matcher:
  #       HttpCode: '200,401'
  #     Targets:
  #       - Id: !Ref TargetEc2InstanceId
  #         Port: 6380

  # -----------------------------------------------------------------
  # 5. ALB Listeners & Rules
  # -----------------------------------------------------------------
  # HTTP Listener (Redirects to HTTPS)
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301
      LoadBalancerArn: !Ref PublicALB
      Port: 80
      Protocol: HTTP

  # HTTPS Listener with ACM Certificate
  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref WildcardCertificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: 'Host Not Found'
            StatusCode: '404'
      LoadBalancerArn: !Ref PublicALB
      Port: 443
      Protocol: HTTPS

  # --- Listener Rules for Routing ---

  # Rule 1: Kanrensha API (kanrensha.domain.com/api/*)
  RuleKanrenshaBack:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TGKanrenshaBack
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub "kanrensha.${DomainName}"
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/api/*"
      ListenerArn: !Ref ALBListenerHTTPS
      Priority: 10

  # Rule 2: Kanrensha Front (kanrensha.domain.com/*)
  RuleKanrenshaFront:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TGKanrenshaFront
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub "kanrensha.${DomainName}"
      ListenerArn: !Ref ALBListenerHTTPS
      Priority: 11

