AWSTemplateFormatVersion: '2010-09-09'
Description: 'ALB, Route53, ACM, and Security Groups for Multi-Subdomain System (Kanrensha, CreateDoc, Investigate)'

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment name (e.g., prod, dev, stg)

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 Hosted Zone ID for your domain (e.g., Z0123456789ABCDEF)

  DomainName:
    Type: String
    Description: Base domain name (e.g., example.com)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the ALB and EC2 instance are located

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 for ALB (must be in a different AZ than Subnet 2)

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 for ALB (must be in a different AZ than Subnet 1)

  TargetEc2InstanceId:
    Type: String
    Description: The EC2 Instance ID where Docker containers are running

Resources:
  # -----------------------------------------------------------------
  # 1. ACM Certificate (Wildcard *.domain)
  # -----------------------------------------------------------------
  WildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "*.${DomainName}"
      SubjectAlternativeNames:
        - !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-wildcard-cert"

  # -----------------------------------------------------------------
  # 2. Security Groups
  # -----------------------------------------------------------------
  # Security Group for ALB (Allows HTTPS and HTTP from internet)
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'Allow HTTPS from internet'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Allow HTTP from internet (for redirection)'
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"

  # Security Group Rule for EC2 (Allows only traffic from ALB to application ports)
  EC2AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for EC2 to allow traffic from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Kanrensha Front (8010) & Back (6180)
        - IpProtocol: tcp
          FromPort: 8010
          ToPort: 8010
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: 'Allow Kanrensha Front from ALB'
        - IpProtocol: tcp
          FromPort: 6180
          ToPort: 6180
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: 'Allow Kanrensha Back from ALB'
        
        # [未実装のためコメントアウト] 書面作成システム(create-doc) 用ルール
        # - IpProtocol: tcp
        #   FromPort: 8020
        #   ToPort: 8020
        #   SourceSecurityGroupId: !Ref ALBSecurityGroup
        #   Description: 'Allow Create-Doc Front from ALB'
        # - IpProtocol: tcp
        #   FromPort: 6280
        #   ToPort: 6280
        #   SourceSecurityGroupId: !Ref ALBSecurityGroup
        #   Description: 'Allow Create-doc Back from ALB'
        
        # [未実装のためコメントアウト] 調査システム(investigate) 用ルール
        # - IpProtocol: tcp
        #   FromPort: 8030
        #   ToPort: 8030
        #   SourceSecurityGroupId: !Ref ALBSecurityGroup
        #   Description: 'Allow Investigate Front from ALB'
        # - IpProtocol: tcp
        #   FromPort: 6380
        #   ToPort: 6380
        #   SourceSecurityGroupId: !Ref ALBSecurityGroup
        #   Description: 'Allow Investigate Back from ALB'
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ec2-app-sg"

  # -----------------------------------------------------------------
  # 3. Application Load Balancer
  # -----------------------------------------------------------------
  PublicALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-multisys-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-multisys-alb"

  # -----------------------------------------------------------------
  # 4. Target Groups
  # -----------------------------------------------------------------
  # --- Kanrensha ---
  TGKanrenshaFront:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg-kanrensha-front"
      Port: 8010
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Targets:
        - Id: !Ref TargetEc2InstanceId
          Port: 8010

  TGKanrenshaBack:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg-kanrensha-back"
      Port: 6180
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /api/actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200,401'
      Targets:
        - Id: !Ref TargetEc2InstanceId
          Port: 6180

  # --- [未実装のためコメントアウト] 書面作成システム(create-doc) ---
  # TGCreateDocFront:
  #   Type: AWS::ElasticLoadBalancingV2::TargetGroup
  #   Properties:
