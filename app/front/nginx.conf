server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve files for SPA with base path /manage-kanrensha
    location /manage-kanrensha {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /manage-kanrensha/index.html;
    }

    # Redirect root URL to /manage-kanrensha/
    location = / {
        return 301 /manage-kanrensha/;
    }

    # Redirect /manage-kanrensha to /manage-kanrensha/ (with trailing slash)
    location = /manage-kanrensha {
        return 301 /manage-kanrensha/;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
